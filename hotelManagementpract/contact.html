<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <main>
        <section>
            <h1>For further querry pls contact us</h1>

            <div></div>
              <form>

                <label for="name">Name</label>
                <input type="text" required id="name"/>

                <label for="email">Email</label>
                <input type="email" required id="name"/>

                <label for="reason">Reason</label>
                <input type="textarea" required id="reason" cols="4" row="2"/>

                <label for="num">Number</label>
                <input type="tel" required id="num" pattern="+91[0-9]-{10}" maxlength="13"/>

                <br>
                <button>Request for Contact</button>

              </form>
            <div>
                <p>email: abc@gmail.com</p>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d109806.98210577291!2d76.71292365!3d30.67710055!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390feeb7a459dbeb%3A0xca229271e467480a!2sMohali%2C%20Punjab!5e0!3m2!1sen!2sin!4v1790234919686!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            
        </section>
    </main>
</body>
</html>
