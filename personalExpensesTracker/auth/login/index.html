<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <main class="login-page dashboard">
   
      <section class="login-card">
         <h2>Login Page</h2>
         <form id="loginForm">
              <div class="input-group">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter you mail"/> 
              </div>

              <div class="input-group">
                <label for="password">Password</label>
                <input  id="password" type="password" placeholder="Enter your password"/> 
              </div>
               <button type="submit" id="loginBtn">Login Now</button>

                <p id="message" class="message"></p>
         </form>
         <script type="module" src="./script.js"></script>
          <p class="signup-text">  Don`t have an account?
                <a href="../signup/index.html">Rejster now</a>
            </p>
      </section>

      <section class="ticker right-section">
           <div class="moving-text">
            <h1>
                Expense Tracker<br>
                Login Form
            </h1>
           </div>
      </section>

    </main>

</body>
</html>
